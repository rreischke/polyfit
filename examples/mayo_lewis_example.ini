# polyfit — example config for the Mayo-Lewis instantaneous model
# Use this when cumulative conversion X < ~5 %.
#
# Run with:   python main.py examples/mayo_lewis_example.ini
#
# ──────────────────────────────────────────────────────────────────────────

[data_structure]

# Path to the data file (relative to the polyfit root directory).
# Supported formats:
#   Plain text (.txt) — 2 columns: X  F
#   CSV 4-col  (.csv) — f0, X, F, dF
#   CSV 5-col  (.csv) — f0, X, dX, F, dF           (EVM: errors on both)
#   CSV 6-col  (.csv) — f0, X, dX, F, dF, df0      (EVM + f0 uncertainty)
file_data = data/data.txt

# false = Mayo-Lewis instantaneous model  (use when X < ~5 %)
# true  = Skeist integrated model         (use when X > ~5 %)
high_conversion = false

# Measurement uncertainties — only used for plain-text files.
# For CSV files the delta columns in the file take priority.
#
# Formats:
#   rel 0.05        — 5 % relative uncertainty on every point
#   abs 0.02        — constant absolute uncertainty of 0.02
#   path/to/cov.txt — full N×N covariance matrix from a file
#
# X_covariance:  uncertainty in the independent variable (e.g. feed f2).
#                Set to rel 0.0 if f2 is prepared gravimetrically and
#                its uncertainty is truly negligible.
X_covariance  = rel 0.05

# Y_covariance:  uncertainty in the dependent variable (e.g. F2, from NMR).
#                Typical NMR precision: 2–5 % relative.  Always required.
Y_covariance  = rel 0.05

# XY_covariance: cross-covariance between X and Y errors.
#                Use rel 0.0 if X and Y are measured independently.
#                Use a non-zero value only if both come from the same
#                measurement (e.g. two integrals of one NMR spectrum).
XY_covariance = rel 0.0

# Example: use external covariance matrix files instead:
# X_covariance  = data/X_covariance.txt
# Y_covariance  = data/Y_covariance.txt
# XY_covariance = data/XY_covariance.txt


[inference]

# Flat (uniform) prior range for each parameter.
# Format: p1_min, p1_max, p2_min, p2_max
# After the MLE is found the grid is automatically tightened to ±10σ,
# so this mainly sets the search space for the initial optimisation.
# For reactivity ratios a lower bound of 0 is appropriate.
prior_range = 0.0, 10.0, 0.0, 10.0

# Goodness-of-fit test (PTE — Probability To Exceed).
# Generates N_pte mock datasets from the best-fit model, re-fits each,
# and plots the chi² distribution.  PTE ~ 0.5 is a good fit;
# PTE < 0.05 suggests the model is misspecified or errors are too small.
run_pte = True
N_pte   = 200


[precision]

# Number of grid points per parameter axis for the posterior evaluation.
# The posterior is evaluated on an N_inter × N_inter grid.
# Run time scales as N_inter²:
#   N_inter = 50  → fast, rough contours
#   N_inter = 100 → good balance (default)
#   N_inter = 200 → high quality, ~4× slower
#   N_inter = 500 → publication quality, slow
N_inter = 100


[plotting]

# Colour of fit lines and posterior contours (hex or matplotlib name).
plot_line_colour = #00689D

# Colour of data points.
plot_data_colour = red

# Axis and parameter labels.  Use $…$ for MathText (no LaTeX install needed).
independent_variable_name = $f_2$
dependent_variable_name   = $F_2$
parameter_1_name          = $r_2$
parameter_2_name          = $r_1$

# Zoom factor for the contour plot.
# 1.0 = auto-range (±10σ around the MLE); 0.5 = zoomed in 2×.
contour_plot_zoom = 1.0

# Full LaTeX rendering (requires latex + dvipng on PATH).
# false = use Matplotlib MathText (works without any TeX installation).
use_tex = False


[output]

# Paths for all output files (relative to the polyfit root).
file_name_contour_plot  = output/contour.pdf
file_name_best_fit_plot = output/bestfit.pdf
file_name_results       = output/results.txt
file_name_contour       = output/posterior.txt
file_name_best_fit      = output/bestfit_curve.txt

# Output file for the PTE histogram (only written when run_pte = true).
pte_output_file         = output/pte_test.pdf
