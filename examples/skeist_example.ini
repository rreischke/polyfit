# polyfit — example config for the Skeist high-conversion model
# Use this when cumulative conversion X > ~5 %.
#
# Run with:   python main.py examples/skeist_example.ini
#
# The Skeist model integrates the Mayo-Lewis equation over the full
# conversion path.  Each data point requires both an initial feed
# composition f0 and a cumulative conversion X_cum — use a CSV file.
#
# ──────────────────────────────────────────────────────────────────────────

[data_structure]

# Path to the data file.  For the Skeist model a CSV file is required
# because each data point needs its own f0 value.
#
# CSV 4-col (.csv) — f0, X_cum, F_cum, dF_cum
# CSV 5-col (.csv) — f0, X_cum, dX_cum, F_cum, dF_cum
# CSV 6-col (.csv) — f0, X_cum, dX_cum, F_cum, dF_cum, df0
#
#   f0     = initial mole fraction of M2 in the feed
#   X_cum  = cumulative monomer conversion (0–1)
#   dX_cum = absolute 1σ uncertainty on X_cum
#   F_cum  = cumulative copolymer mole fraction of M2
#   dF_cum = absolute 1σ uncertainty on F_cum
#   df0    = absolute 1σ uncertainty on f0 (6-col only)
file_data = data/f0XFIUPAC.csv

# true = Skeist integrated model (high conversion, X > ~5 %)
high_conversion = true

# For CSV files the covariance settings below are IGNORED — all errors
# are read directly from the delta columns in the file.
#
# These settings only apply if you use a plain-text file with the Skeist
# model (unusual; most Skeist experiments use CSV).
X_covariance  = rel 0.0
Y_covariance  = rel 0.05
XY_covariance = rel 0.0

# f0 uncertainty — for plain-text Skeist data only.
# For 6-column CSV files df0 is read from column 6; leave this unset.
# f0_covariance = rel 0.01


[inference]

# Prior range: p1_min, p1_max, p2_min, p2_max
# p1 = r2 (reactivity ratio of M2), p2 = r1 (reactivity ratio of M1).
prior_range = 0.0, 2.0, 0.0, 2.0

# Goodness-of-fit test (PTE — Probability To Exceed).
# Highly recommended for the Skeist model to verify that the integrated
# equation provides a statistically acceptable description of the data.
# PTE ~ 0.5 is good; PTE < 0.05 means the fit is poor.
run_pte = true
N_pte   = 200


[precision]

# The Skeist model is slower per likelihood evaluation because each call
# involves numerical integration.  Keep N_inter ≤ 150 for reasonable
# run times; use 100 as a starting point.
N_inter = 100


[plotting]

plot_line_colour = #00689D
plot_data_colour = red

# Labels for the Skeist model:
#   independent variable = X_cum (cumulative conversion)
#   dependent variable   = F_cum (cumulative copolymer composition)
independent_variable_name = $X_\mathrm{cum}$
dependent_variable_name   = $F_\mathrm{cum}$
parameter_1_name          = $r_2$
parameter_2_name          = $r_1$

contour_plot_zoom = 1.0
use_tex           = False


[output]

file_name_contour_plot  = output/skeist_contour.pdf
file_name_best_fit_plot = output/skeist_bestfit.pdf
file_name_results       = output/skeist_results.txt
file_name_contour       = output/skeist_posterior.txt
file_name_best_fit      = output/skeist_bestfit_curve.txt
pte_output_file         = output/skeist_pte.pdf
